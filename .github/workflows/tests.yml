name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-latest
    env:
      RELEASE: laravel-mcp-hub-1.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, dom, mbstring, zip
          coverage: none
          tools: composer:2.9.8
      - run: composer validate --strict
      - run: composer archive --format=zip --dir=build --file=$RELEASE
      - run: php scripts/check-release.php build/$RELEASE.zip
      - run: composer update --working-dir=.compat/release --prefer-dist --no-interaction --no-progress
      - run: composer audit --working-dir=.compat/release
      - run: php .compat/release/vendor/bin/phpunit --bootstrap .compat/release/vendor/autoload.php --log-junit build/distribution.xml
      - run: sha256sum build/$RELEASE.zip > build/$RELEASE.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: |
            build/${{ env.RELEASE }}.zip
            build/${{ env.RELEASE }}.zip.sha256
            build/distribution.xml
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-chat.js
  native-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mcp_package_test
          POSTGRES_USER: mcp_test
          POSTGRES_PASSWORD: fixture-password-not-for-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcp_test -d mcp_package_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MCP_HUB_TEST_PG_DATABASE: mcp_package_test
      MCP_HUB_TEST_PG_USER: mcp_test
      MCP_HUB_TEST_PG_PASSWORD: fixture-password-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_pgsql, dom, mbstring
          coverage: none
          tools: composer:2.9.8
      - run: composer install --no-interaction --no-progress
      - run: php vendor/bin/phpunit --filter NativeDatabaseTest --log-junit build/native-postgres.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-postgres
          path: build/native-postgres.xml
  tests:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {laravel: '5.8', php: '7.2'}
          - {laravel: '5.8', php: '7.4'}
          - {laravel: '6', php: '7.2'}
          - {laravel: '7', php: '7.2'}
          - {laravel: '8', php: '7.3'}
          - {laravel: '9', php: '8.0'}
          - {laravel: '9', php: '8.2'}
          - {laravel: '10', php: '8.1'}
          - {laravel: '11', php: '8.2'}
          - {laravel: '12', php: '8.2'}
          - {laravel: '12', php: '8.4'}
          - {laravel: '13', php: '8.3'}
          - {laravel: '13', php: '8.4'}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, dom, mbstring
          coverage: none
          tools: composer:2.9.8
      - run: composer validate --strict
      - run: php scripts/prepare-matrix.php ${{ matrix.laravel }}
      - run: composer update --working-dir=.compat/${{ matrix.laravel }} --prefer-dist --no-interaction --no-progress
      - run: composer check-platform-reqs --working-dir=.compat/${{ matrix.laravel }}
      - name: Confirm the resolved Guzzle major
        shell: bash
        run: |
          guzzle=$(composer show --working-dir=.compat/${{ matrix.laravel }} guzzlehttp/guzzle --format=json | php -r 'echo json_decode(stream_get_contents(STDIN), true)["versions"][0];')
          echo "guzzlehttp/guzzle $guzzle"
          # Laravel 13 applications install Guzzle 8 by default; older rows keep Guzzle 7.
          if [ "${{ matrix.laravel }}" = "13" ]; then case "$guzzle" in 8.*) ;; *) exit 1;; esac; fi
      - run: php .compat/${{ matrix.laravel }}/vendor/bin/phpunit --bootstrap .compat/${{ matrix.laravel }}/vendor/autoload.php --log-junit .compat/results.xml
      - name: Review historical upstream advisories
        if: always()
        shell: bash
        run: |
          status=0
          composer audit --working-dir=.compat/${{ matrix.laravel }} --format=json > .compat/audit.json || status=$?
          if [ "$status" -gt 3 ]; then exit "$status"; fi
          php scripts/check-audit.php .compat/audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laravel-${{ matrix.laravel }}-php-${{ matrix.php }}
          include-hidden-files: true
          path: |
            .compat/results.xml
            .compat/audit.json
            .compat/${{ matrix.laravel }}/composer.lock
